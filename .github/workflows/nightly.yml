name: Nightly Build

on:
  schedule:
    - cron: "0 2 * * *"  # daily at 02:00 UTC: check for a new yt-dlp
    - cron: "0 3 * * 1"  # Mondays 03:00 UTC: uncached rebuild for base image / ffmpeg security fixes
  push:
    # rebuild when a merge changes what goes into the image (e.g. dependabot bumps),
    # otherwise those fixes only ship with the next yt-dlp release. The bot's own
    # yt-dlp bump commit is pushed with GITHUB_TOKEN, which doesn't re-trigger this.
    branches: [main]
    paths:
      - requirements.txt
      - Dockerfile
      - main.py
      - app/**
      - static/**
  workflow_dispatch:  # manual trigger
    inputs:
      force_build:
        description: "Rebuild and push the image even if yt-dlp is already up to date"
        type: boolean
        default: false

permissions:
  # write needed: the workflow commits the yt-dlp version bump back to main
  contents: write
  packages: write

concurrency:
  # two runs must not race on committing the requirements.txt bump
  group: nightly
  cancel-in-progress: false

defaults:
  run:
    # explicit bash adds -o pipefail, so a failed curl can't hide behind jq
    shell: bash

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get latest yt-dlp version from PyPI
        id: ytdlp
        run: |
          # PyPI, not GitHub releases: a release can appear on GitHub before it is
          # installable via pip, which would break the image build. PyPI also uses
          # the same normalized version format as requirements.txt (2026.3.17,
          # not the zero-padded git tag 2026.03.17).
          META=$(curl -fsS https://pypi.org/pypi/yt-dlp/json)
          LATEST=$(jq -er '.info.version' <<< "$META")
          # the youtube solver scripts must match the yt-dlp release; take the
          # version yt-dlp itself pins in its "default" extra
          EJS=$(jq -er '[.info.requires_dist[] | select(test("^yt-dlp-ejs==.*extra == \"default\""))][0]
            | capture("==(?<v>[^;[:space:]]+)").v' <<< "$META")
          # never write an empty or garbage version into requirements.txt
          for V in "$LATEST" "$EJS"; do
            if [[ ! "$V" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
              echo "::error::Unexpected version from PyPI: '$V'"
              exit 1
            fi
          done
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          echo "ejs=$EJS" >> $GITHUB_OUTPUT

      - name: Get current yt-dlp version from requirements.txt
        id: current
        run: |
          CURRENT=$(grep '^yt-dlp==' requirements.txt | sed 's/yt-dlp==//')
          CURRENT_EJS=$(grep '^yt-dlp-ejs==' requirements.txt | sed 's/yt-dlp-ejs==//')
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "ejs=$CURRENT_EJS" >> $GITHUB_OUTPUT

      - name: Compare versions
        id: compare
        run: |
          if [ "${{ steps.ytdlp.outputs.latest }}" != "${{ steps.current.outputs.current }}" ] ||
             [ "${{ steps.ytdlp.outputs.ejs }}" != "${{ steps.current.outputs.ejs }}" ]; then
            echo "update_needed=true" >> $GITHUB_OUTPUT
            echo "build_needed=true" >> $GITHUB_OUTPUT
            echo "New yt-dlp version available: ${{ steps.ytdlp.outputs.latest }} (current: ${{ steps.current.outputs.current }})"
          else
            echo "update_needed=false" >> $GITHUB_OUTPUT
            echo "build_needed=${{ github.event_name == 'push' || github.event.schedule == '0 3 * * 1' || inputs.force_build == true }}" >> $GITHUB_OUTPUT
            echo "yt-dlp is up to date (${{ steps.current.outputs.current }})"
          fi
          # the cached `apk add ffmpeg` layer would otherwise never pick up alpine fixes
          echo "no_cache=${{ github.event.schedule == '0 3 * * 1' || inputs.force_build == true }}" >> $GITHUB_OUTPUT

      # Only edit the file here. It gets committed after the image is pushed, so a
      # failed build leaves main untouched and the next run tries again instead of
      # seeing "up to date" and skipping the build forever.
      - name: Update requirements.txt
        if: steps.compare.outputs.update_needed == 'true'
        run: |
          sed -i "s/^yt-dlp==.*/yt-dlp==${{ steps.ytdlp.outputs.latest }}/" requirements.txt
          sed -i "s/^yt-dlp-ejs==.*/yt-dlp-ejs==${{ steps.ytdlp.outputs.ejs }}/" requirements.txt

      - name: Set up Python
        if: steps.compare.outputs.build_needed == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # bot commits don't trigger tests.yml, so this is the only test run a yt-dlp
      # bump gets before it lands on :latest
      - name: Run tests
        if: steps.compare.outputs.build_needed == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --group dev
          pytest

      # GHCR always gets the image. Docker Hub only with credentials: a hard
      # failure here used to block GHCR too, so no image shipped for months.
      - name: Pick image tags
        id: tags
        if: steps.compare.outputs.build_needed == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PAT: ${{ secrets.DOCKERHUB_PAT }}
          VERSION: ${{ steps.ytdlp.outputs.latest }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "tags<<EOF"
            echo "ghcr.io/$OWNER/yt-dlp-web-gui:latest"
            echo "ghcr.io/$OWNER/yt-dlp-web-gui:$VERSION"
            if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_PAT" ]; then
              echo "$DOCKERHUB_USERNAME/yt-dlp-web-gui:latest"
              echo "$DOCKERHUB_USERNAME/yt-dlp-web-gui:$VERSION"
            fi
            echo "EOF"
          } >> $GITHUB_OUTPUT
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_PAT" ]; then
            echo "dockerhub=true" >> $GITHUB_OUTPUT
          else
            echo "dockerhub=false" >> $GITHUB_OUTPUT
            echo "::warning::Repo secrets DOCKERHUB_USERNAME / DOCKERHUB_PAT are missing (Settings > Secrets and variables > Actions); pushing to GHCR only, Docker Hub stays stale"
          fi

      - name: Set up Docker Buildx
        if: steps.compare.outputs.build_needed == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.compare.outputs.build_needed == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.compare.outputs.build_needed == 'true' && steps.tags.outputs.dockerhub == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Build and push
        if: steps.compare.outputs.build_needed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          pull: true
          no-cache: ${{ steps.compare.outputs.no_cache == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Commit version bump
        if: steps.compare.outputs.update_needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update yt-dlp to ${{ steps.ytdlp.outputs.latest }} (yt-dlp-ejs ${{ steps.ytdlp.outputs.ejs }})"
          git push
